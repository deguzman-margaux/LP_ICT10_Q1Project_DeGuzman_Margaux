<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Calculator & Receipt Portal</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython_stdlib.js"></script>
    
    <link rel="icon" type="image/x-icon" href="nullscape_cube-removebg-preview.png">

    <style>
        @font-face {
            font-family: 'Accanthis';
            src: url('AccanthisadfstdRegular-dvZK.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        body {
            font-family: 'Accanthis', sans-serif;
            background-image: url('backgroundone.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;   
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin: 0;
        }
        header {
            background-color: #301148;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            color: white;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
        }
        .header-container {
            max-width: 42rem;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin: 0;
        }
        nav {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        nav a {
            color: white;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        nav a:hover, nav a.active {
            opacity: 1;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        main {
            max-width: 42rem;
            width: 100%;
            margin: 0 auto 3rem auto;
            padding: 0 1rem;
            box-sizing: border-box;
        }
        section {
            background: #301148;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            border: 1px solid #150322;
        }
        h2 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #b7b7cb;
            margin-top: 0;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        h2 svg {
            width: 1.25rem;
            height: 1.25rem;
            color: #4f46e5;
        }
        .items-space {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .item-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.875rem;
            border: 1px solid #b7b7cb;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .item-label:hover {
            background-color: rgb(32, 3, 26);
            font-size: 0.875rem;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            transition: box-shadow 0.2s ease-in-out;
        }
        .item-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .item-left input {
            width: 1rem;
            height: 1rem;
            accent-color: rgb(32, 3, 26);
        }
        .item-text {
            font-size: 0.875rem;
            font-weight: 500;
            color: #b7b7cb;
        }
        .item-price {
            font-size: 0.875rem;
            font-weight: 600;
            color: #b7b7cb;
        }
        button {
            width: 100%;
            background-color: #270224;
            color: white;
            font-weight: 500;
            padding: 0.625rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            font-size: 0.875rem;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            transition: box-shadow 0.2s ease-in-out;
        }
        button:hover {
            background-color: rgb(88, 41, 104);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.9);
        }
        #show {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #b7b7cb;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            color: #334155;
            font-size: 0.875rem;
            min-height: 50px;
            display: flex;
            align-items: center;
        }
        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.75rem;
            color: #b7b7cb;
            border-top: 1px solid #3f142e;
            background-color: rgb(32, 3, 26);
        }
    </style>
</head>

<body onload="brython()">

    <header>
        <div class="header-container">
            <img src="nullscape_logo.png" alt="logo" height="60px" class="rounded">
            <nav>
                <a href="sku.html">SKU</a>
                <a href="receipt.html" class="active">Receipt</a>
            </nav>
        </div>
    </header>

    <main>
        <section>
            <h2>
                <img src="nullscape_cube-removebg-preview.png" alt="logo" height="100px" class="rounded">
                RECEIPT
            </h2>
            
            <div class="items-space">
                <label class="item-label">
                    <div class="item-left">
                        <input type="checkbox" id="spirit" value="1400.00">
                        <span class="item-text">Spirit</span>
                    </div>
                    <span class="item-price">1400.00</span>
                </label>

                <label class="item-label">
                    <div class="item-left">
                        <input type="checkbox" id="grappler" value="1800.00">
                        <span class="item-text">Grappler</span>
                    </div>
                    <span class="item-price">1800.00</span>
                </label>

                <label class="item-label">
                    <div class="item-left">
                        <input type="checkbox" id="glider" value="2000.00">
                        <span class="item-text">Glider</span>
                    </div>
                    <span class="item-price">2000.00</span>
                </label>
            </div>

            <button id="calc_btn">
                Calculate Total & Generate Receipt
            </button>
            
            <div id="show">
                Receipt output will appear here...
            </div>
        </section>
    </main>

    <script type="text/python" src="receipt.py"></script>

    <footer>
        &copy; ICT First Quarter Project. Margaux De Guzman.
    </footer>
</body>
</html>
